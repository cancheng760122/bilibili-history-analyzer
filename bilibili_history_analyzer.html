<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B站观看历史分析工具</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }

        /* 上传区域 */
        .upload-section {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        .upload-section h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fb7299, #23ade5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .upload-section p { color: #888; margin-bottom: 30px; }
        .drop-zone {
            border: 3px dashed #ddd;
            border-radius: 16px;
            padding: 50px 30px;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #fb7299;
            background: #fff5f7;
            transform: scale(1.02);
        }
        .drop-zone .icon { font-size: 64px; margin-bottom: 15px; }
        .drop-zone .text { font-size: 18px; color: #666; margin-bottom: 10px; }
        .drop-zone .hint { font-size: 13px; color: #aaa; }
        .file-input { display: none; }
        .file-info {
            margin-top: 20px;
            padding: 15px;
            background: #f0f9ff;
            border-radius: 10px;
            display: none;
        }
        .file-info.show { display: block; }
        .file-info .name { font-weight: bold; color: #0369a1; }
        .file-info .size { color: #666; font-size: 13px; margin-top: 5px; }

        /* 加载动画 */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        .loading.show { display: block; }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #fb7299;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 报告区域 */
        .report-section { display: none; }
        .report-section.show { display: block; }

        .header {
            background: linear-gradient(135deg, #fb7299, #23ade5);
            color: white;
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .header h1 { font-size: 32px; margin-bottom: 15px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .header p { font-size: 16px; opacity: 0.95; }
        .tags { display: flex; justify-content: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
        .tag {
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
        .stat-card .number {
            font-size: 30px;
            font-weight: bold;
            background: linear-gradient(135deg, #fb7299, #23ade5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-card .label { font-size: 13px; color: #888; margin-top: 8px; }

        .summary-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .summary-card h2 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #333;
            border-left: 4px solid #fb7299;
            padding-left: 15px;
        }
        .summary-card p { line-height: 1.8; color: #555; margin-bottom: 12px; font-size: 15px; }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 30px;
        }
        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .chart-card.full { grid-column: 1 / -1; }
        .chart-card h3 { font-size: 18px; margin-bottom: 15px; color: #444; }
        .chart { width: 100%; height: 350px; }
        .chart.tall { height: 450px; }

        .footer {
            text-align: center;
            padding: 30px;
            color: rgba(255,255,255,0.8);
            font-size: 13px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #fb7299, #23ade5);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(251,114,153,0.4); }

        @media (max-width: 768px) {
            .chart-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 24px; }
            .upload-section h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 上传区域 -->
        <div class="upload-section" id="uploadSection">
            <h1>📊 B站观看历史分析工具</h1>
            <p>拖拽或选择B站导出的JSON/CSV文件，一键生成深度分析报告</p>
            <div class="drop-zone" id="dropZone">
                <div class="icon">📁</div>
                <div class="text">拖拽文件到这里，或点击选择文件</div>
                <div class="hint">支持 JSON 格式（B站官方导出）和 CSV 格式</div>
            </div>
            <input type="file" class="file-input" id="fileInput" accept=".json,.csv">
            <div class="file-info" id="fileInfo">
                <div class="name" id="fileName"></div>
                <div class="size" id="fileSize"></div>
            </div>
            <button class="btn" id="analyzeBtn" style="display:none;">🚀 开始分析</button>
        </div>

        <!-- 加载动画 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color:white;font-size:16px;">正在分析数据，请稍候...</p>
        </div>

        <!-- 报告区域 -->
        <div class="report-section" id="reportSection">
            <div class="header">
                <h1>📊 B站观看历史深度分析报告</h1>
                <p id="dateRange"></p>
                <div class="tags" id="tags"></div>
            </div>

            <div class="stats" id="stats"></div>

            <div class="summary-card">
                <h2>🤖 AI深度总结</h2>
                <div id="summaryText"></div>
            </div>

            <div class="chart-grid">
                <div class="chart-card full">
                    <h3>📈 每日观看趋势</h3>
                    <div id="dailyChart" class="chart"></div>
                </div>
                <div class="chart-card">
                    <h3>⏰ 24小时观看分布</h3>
                    <div id="hourChart" class="chart"></div>
                </div>
                <div class="chart-card">
                    <h3>📅 星期观看分布</h3>
                    <div id="weekChart" class="chart"></div>
                </div>
                <div class="chart-card full">
                    <h3>👥 最常观看的UP主 TOP15</h3>
                    <div id="authorChart" class="chart tall"></div>
                </div>
                <div class="chart-card">
                    <h3>🔤 标题关键词 TOP30</h3>
                    <div id="wordChart" class="chart tall"></div>
                </div>
                <div class="chart-card">
                    <h3>📺 视频类型分布</h3>
                    <div id="typeChart" class="chart"></div>
                </div>
            </div>

            <div style="text-align:center;margin-bottom:30px;">
                <button class="btn" onclick="location.reload()">🔄 重新分析其他文件</button>
            </div>

            <div class="footer">
                <p>由B站历史分析工具生成 | 数据仅供个人参考</p>
            </div>
        </div>
    </div>

    <script>
        let fileData = null;
        let charts = {};

        // 拖拽上传
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const analyzeBtn = document.getElementById('analyzeBtn');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                fileData = { name: file.name, size: file.size, content: e.target.result };
                document.getElementById('fileName').textContent = '📄 ' + file.name;
                document.getElementById('fileSize').textContent = '文件大小：' + (file.size / 1024).toFixed(1) + ' KB';
                fileInfo.classList.add('show');
                analyzeBtn.style.display = 'inline-block';
            };
            reader.readAsText(file);
        }

        analyzeBtn.addEventListener('click', () => {
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('loading').classList.add('show');
            setTimeout(() => {
                try {
                    analyzeData();
                    document.getElementById('loading').classList.remove('show');
                    document.getElementById('reportSection').classList.add('show');
                } catch (err) {
                    alert('分析失败：' + err.message);
                    location.reload();
                }
            }, 500);
        });

        function analyzeData() {
            let records = [];

            if (fileData.name.endsWith('.json')) {
                const json = JSON.parse(fileData.content);
                // 尝试找到记录数组
                let dataArray = null;
                if (Array.isArray(json)) dataArray = json;
                else if (json.history && Array.isArray(json.history)) dataArray = json.history;
                else if (json.data && Array.isArray(json.data)) dataArray = json.data;
                else {
                    for (let key in json) {
                        if (Array.isArray(json[key]) && json[key].length > 0 && json[key][0].title) {
                            dataArray = json[key];
                            break;
                        }
                    }
                }
                if (!dataArray) throw new Error('无法找到记录数组，请检查JSON格式');

                records = dataArray.map(item => ({
                    title: item.title || '',
                    author: item.author_name || item.author || item.uname || '',
                    view_at: item.view_at || item.view_time || item.time || 0,
                    bvid: item.bvid || '',
                    duration: item.duration || 0,
                    business: item.business || '视频'
                }));
            } else if (fileData.name.endsWith('.csv')) {
                const lines = fileData.content.split('\n');
                const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    const values = parseCSVLine(lines[i]);
                    const record = {};
                    headers.forEach((h, idx) => record[h] = values[idx] || '');
                    records.push({
                        title: record['标题'] || record['title'] || '',
                        author: record['作者'] || record['author'] || record['UP主'] || '',
                        view_at: parseDate(record['观看时间'] || record['view_at'] || record['时间'] || ''),
                        bvid: record['BV号'] || record['bvid'] || '',
                        duration: parseInt(record['视频时长(秒)'] || record['duration'] || 0),
                        business: record['类型'] || record['business'] || '视频'
                    });
                }
            }

            // 过滤有效记录
            records = records.filter(r => r.title && r.view_at);
            if (records.length === 0) throw new Error('没有有效记录');

            // 数据处理
            const dailyCount = {};
            const hourCount = {};
            const weekCount = { '周一': 0, '周二': 0, '周三': 0, '周四': 0, '周五': 0, '周六': 0, '周日': 0 };
            const authorCount = {};
            const typeCount = {};
            const wordCount = {};
            let totalDuration = 0;

            const weekNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

            records.forEach(r => {
                const date = new Date(r.view_at * 1000);
                if (isNaN(date.getTime())) return;

                const dateStr = date.toISOString().split('T')[0];
                dailyCount[dateStr] = (dailyCount[dateStr] || 0) + 1;

                const hour = date.getHours();
                hourCount[hour] = (hourCount[hour] || 0) + 1;

                weekCount[weekNames[date.getDay()]]++;

                if (r.author) authorCount[r.author] = (authorCount[r.author] || 0) + 1;
                if (r.business) typeCount[r.business] = (typeCount[r.business] || 0) + 1;
                totalDuration += r.duration || 0;

                // 简单分词（按标点和空格分割，取2-4字词）
                const words = r.title.split(/[\s,，。！？、：；""''（）\[\]【】]+/).filter(w => w.length >= 2 && w.length <= 4);
                words.forEach(w => {
                    if (!/^[\u4e00-\u9fa5a-zA-Z]+$/.test(w)) return;
                    wordCount[w] = (wordCount[w] || 0) + 1;
                });
            });

            // 排序
            const dailyData = Object.entries(dailyCount).sort((a,b) => a[0].localeCompare(b[0])).map(([date, count]) => ({ date, count }));
            const hourData = Object.entries(hourCount).sort((a,b) => a[0]-b[0]).map(([hour, count]) => ({ hour: hour + '时', count }));
            const weekData = Object.entries(weekCount).map(([day, count]) => ({ day, count }));
            const authorData = Object.entries(authorCount).sort((a,b) => b[1]-a[1]).slice(0, 15).map(([name, count]) => ({ name, count }));
            const wordData = Object.entries(wordCount).sort((a,b) => b[1]-a[1]).slice(0, 30).map(([name, value]) => ({ name, value }));
            const typeData = Object.entries(typeCount).map(([name, value]) => ({ name, value }));

            // 统计数据
            const totalRecords = records.length;
            const totalHours = totalDuration / 3600;
            const dates = Object.keys(dailyCount).sort();
            const startDate = dates[0];
            const endDate = dates[dates.length - 1];
            const totalDays = Math.ceil((new Date(endDate) - new Date(startDate)) / (1000*60*60*24)) + 1;
            const daysWatched = dates.length;
            const watchRate = (daysWatched / totalDays * 100).toFixed(1);
            const maxDay = dailyData.reduce((a,b) => a.count > b.count ? a : b);
            const maxHour = hourData.reduce((a,b) => a.count > b.count ? a : b);
            const maxWeek = weekData.reduce((a,b) => a.count > b.count ? a : b);

            // 兴趣标签
            const tags = [];
            const topWords = wordData.slice(0, 20).map(w => w.name);
            if (topWords.some(w => ['鸣潮','战双','异环','游戏','Steam','神作','攻略','角色'].includes(w))) tags.push('🎮 游戏爱好者');
            if (topWords.some(w => ['AI','手机','iPhone','NFC','门禁卡','教程','使用'].includes(w))) tags.push('📱 科技数码控');
            if (topWords.some(w => ['建模','数学','国赛','数模'].includes(w))) tags.push('📚 学习上进型');

            const maxHourNum = parseInt(maxHour.hour);
            let timePattern = '';
            if (maxHourNum < 6) timePattern = '🌙 夜猫子型（凌晨活跃）';
            else if (maxHourNum < 12) timePattern = '🌅 早起型（上午活跃）';
            else if (maxHourNum < 18) timePattern = '☀️ 白天型（下午活跃）';
            else timePattern = '🌆 晚间型（晚上活跃）';
            tags.push(timePattern);

            // 周末vs工作日
            const weekendCount = weekCount['周六'] + weekCount['周日'];
            const weekdayCount = totalRecords - weekendCount;
            const weekendAvg = weekendCount / 2;
            const weekdayAvg = weekdayCount / 5;
            let weekendPattern = '';
            if (weekendAvg > weekdayAvg * 1.5) weekendPattern = '🎉 周末狂欢型';
            else if (weekdayAvg > weekendAvg * 1.5) weekendPattern = '💼 工作日摸鱼型';
            else weekendPattern = '⚖️ 均衡型';
            tags.push(weekendPattern);

            // 渲染
            document.getElementById('dateRange').textContent = `统计时间：${startDate} ~ ${endDate} | 共 ${totalDays} 天`;
            document.getElementById('tags').innerHTML = tags.map(t => `<span class="tag">${t}</span>`).join('');

            document.getElementById('stats').innerHTML = `
                <div class="stat-card"><div class="number">${totalRecords}</div><div class="label">总观看视频</div></div>
                <div class="stat-card"><div class="number">${totalHours.toFixed(1)}h</div><div class="label">总观看时长</div></div>
                <div class="stat-card"><div class="number">${watchRate}%</div><div class="label">观看活跃度</div></div>
                <div class="stat-card"><div class="number">${maxDay.count}</div><div class="label">单日最多观看</div></div>
                <div class="stat-card"><div class="number">${maxHour.hour}</div><div class="label">高峰时段</div></div>
                <div class="stat-card"><div class="number">${maxWeek.day}</div><div class="label">最活跃星期</div></div>
            `;

            document.getElementById('summaryText').innerHTML = `
                <p>在过去的 <strong>${totalDays}</strong> 天里，你一共观看了 <strong>${totalRecords}</strong> 个视频，总观看时长约 <strong>${totalHours.toFixed(1)}</strong> 小时，平均每天看 <strong>${(totalRecords/totalDays).toFixed(1)}</strong> 个视频。</p>
                <p>你的观看活跃度为 <strong>${watchRate}%</strong>（${daysWatched}/${totalDays}天有观看记录）。最疯狂的一天是 <strong>${maxDay.date}</strong>，一口气看了 <strong>${maxDay.count}</strong> 个视频！</p>
                <p>从时间分布来看，你属于<strong>${timePattern}</strong>，最活跃的时段是 <strong>${maxHour.hour}</strong>。从星期分布来看，你是<strong>${weekendPattern}</strong>，最活跃的一天是 <strong>${maxWeek.day}</strong>。</p>
                <p>兴趣方面，你最关注的关键词是 <strong>${wordData[0]?.name || '无'}</strong>（${wordData[0]?.value || 0}次），其次是 <strong>${wordData[1]?.name || '无'}</strong>（${wordData[1]?.value || 0}次）和 <strong>${wordData[2]?.name || '无'}</strong>（${wordData[2]?.value || 0}次）。最常看的UP主是 <strong>${authorData[0]?.name || '无'}</strong>（${authorData[0]?.count || 0}个视频）。</p>
            `;

            // 渲染图表
            renderCharts(dailyData, hourData, weekData, authorData, wordData, typeData);
        }

        function renderCharts(dailyData, hourData, weekData, authorData, wordData, typeData) {
            // 每日趋势
            charts.daily = echarts.init(document.getElementById('dailyChart'));
            charts.daily.setOption({
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'category', data: dailyData.map(d => d.date), axisLabel: { rotate: 45 } },
                yAxis: { type: 'value', name: '观看条数' },
                series: [{ data: dailyData.map(d => d.count), type: 'line', smooth: true, areaStyle: { color: 'rgba(251,114,153,0.3)' }, itemStyle: { color: '#fb7299' } }],
                grid: { left: '3%', right: '4%', bottom: '15%', containLabel: true }
            });

            // 时段分布
            charts.hour = echarts.init(document.getElementById('hourChart'));
            charts.hour.setOption({
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'category', data: hourData.map(d => d.hour) },
                yAxis: { type: 'value' },
                series: [{ data: hourData.map(d => d.count), type: 'bar', itemStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#23ade5'},{offset:1,color:'#fb7299'}]) } }],
                grid: { left: '3%', right: '4%', bottom: '10%', containLabel: true }
            });

            // 星期分布
            charts.week = echarts.init(document.getElementById('weekChart'));
            charts.week.setOption({
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'category', data: weekData.map(d => d.day) },
                yAxis: { type: 'value' },
                series: [{ data: weekData.map(d => d.count), type: 'bar', itemStyle: { color: '#2ca02c', borderRadius: [4,4,0,0] } }],
                grid: { left: '3%', right: '4%', bottom: '10%', containLabel: true }
            });

            // TOP UP主
            charts.author = echarts.init(document.getElementById('authorChart'));
            charts.author.setOption({
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'value' },
                yAxis: { type: 'category', data: authorData.map(d => d.name).reverse(), axisLabel: { width: 120, overflow: 'truncate' } },
                series: [{ data: authorData.map(d => d.count).reverse(), type: 'bar', itemStyle: { color: new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#fb7299'},{offset:1,color:'#ff9a9e'}]) } }],
                grid: { left: '20%', right: '5%', bottom: '5%', top: '5%', containLabel: true }
            });

            // 关键词
            charts.word = echarts.init(document.getElementById('wordChart'));
            charts.word.setOption({
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'value' },
                yAxis: { type: 'category', data: wordData.map(d => d.name).reverse(), axisLabel: { fontSize: 11 } },
                series: [{ data: wordData.map(d => d.value).reverse(), type: 'bar', itemStyle: { color: new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#9467bd'},{offset:1,color:'#c39bd3'}]) } }],
                grid: { left: '15%', right: '5%', bottom: '5%', top: '5%', containLabel: true }
            });

            // 类型分布
            charts.type = echarts.init(document.getElementById('typeChart'));
            charts.type.setOption({
                tooltip: { trigger: 'item' },
                series: [{ type: 'pie', radius: ['40%', '70%'], data: typeData, itemStyle: { borderRadius: 8, borderColor: '#fff', borderWidth: 2 }, label: { formatter: '{b}: {c} ({d}%)' } }]
            });

            window.addEventListener('resize', () => {
                Object.values(charts).forEach(c => c.resize());
            });
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        function parseDate(dateStr) {
            if (!dateStr) return 0;
            if (typeof dateStr === 'number') return dateStr;
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? 0 : Math.floor(d.getTime() / 1000);
        }
    </script>
</body>
</html>
